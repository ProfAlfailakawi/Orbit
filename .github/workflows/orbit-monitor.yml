name: ORBIT scheduled GitHub monitoring

on:
  schedule:
    # Daily at 08:00 Kuwait time; the backend's durable Firestore gate runs
    # an actual GitHub scan at most once every 72 hours.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: orbit-scheduled-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Invoke the authenticated monitoring endpoint
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SCHEDULER_SERVICE_ACCOUNT: ${{ vars.ORBIT_SCHEDULER_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SERVICE_URL="$(gcloud run services describe orbit-api --project "$PROJECT_ID" --region me-central1 --format='value(status.url)')"
          TOKEN="$(gcloud auth print-identity-token \
            --impersonate-service-account="$SCHEDULER_SERVICE_ACCOUNT" \
            --audiences="$SERVICE_URL" --include-email)"
          RESPONSE="$(curl --fail --silent --show-error --max-time 330 \
            -X POST -H "Authorization: Bearer $TOKEN" \
            "$SERVICE_URL/internal/scheduler/github-sync")"
          unset TOKEN
          printf '%s' "$RESPONSE" | jq -e '(.completedAt != null) or (.skipped == "not due") or (.skipped == "run already active")' >/dev/null
          printf '%s\n' "$RESPONSE" | jq -c '{completedAt, skipped, nextDueAt, repositoryCount:(.syncedResults|length?)}'
