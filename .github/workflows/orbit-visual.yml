name: ORBIT browser and visual smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: 3100
      # Test-only placeholder so Firebase client modules initialize in CI.
      # Production uses the restricted project key supplied at build time.
      VITE_FIREBASE_API_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate disposable test credential
        run: |
          PASSKEY="$(openssl rand -hex 24)"
          SENSOR_TOKEN="$(openssl rand -hex 32)"
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSKEY"
          echo "::add-mask::$SENSOR_TOKEN"
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "ORBIT_OPERATOR_PASSKEY=$PASSKEY" >> "$GITHUB_ENV"
          echo "ORBIT_SENSOR_INGEST_TOKEN=$SENSOR_TOKEN" >> "$GITHUB_ENV"
          echo "ORBIT_SENSOR_APP_ID=MIRAS" >> "$GITHUB_ENV"
          echo "ORBIT_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start ORBIT preview
        run: |
          nohup npm run dev > /tmp/orbit-preview.log 2>&1 < /dev/null &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3100/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/orbit-preview.log
          exit 1
      - name: Browser smoke check
        run: node scripts/visual-smoke.mjs
      - name: Save visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-visual-screenshots
          path: test-artifacts/
          retention-days: 7
