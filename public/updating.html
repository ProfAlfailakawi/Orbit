<!doctype html>
<!--
  صفحة «أوربت يتلقّى تحديثاً».

  أثناء النشر يتبدّل الخادم، فتجيب واجهةُ Google الأماميّة بصفحة خطأٍ إنجليزية
  (500/502/503/504) لا يكتبها خادمُنا أصلاً. عاملُ الخدمة (public/sw.js) يحفظ
  هذه الصفحة عند تثبيته، ويقدّمها بدلاً من ذلك الجواب أو من انقطاع التنقّل —
  والرابطُ في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  المشهد: كوكبُ علامة أوربت أسفل الشاشة، وقمرٌ صناعيّ يدور حوله في مدارٍ بيضاويّ،
  ونجومٌ خافتة تنجرف خلفه. النصّ في أعلى زاوية البداية كشاشة مراقبةٍ أرضية.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطُّ خطُّ أوربت المحفوظ في /fonts وإلا خطُّ
  النظام. تسأل /api/version (عامّ، بلا دخول، لا يُحفظ) كل ثلاث ثوانٍ وتتباطأ
  تدريجياً، فإذا أجاب أعادت فتح الصفحة المطلوبة. وإن عادت الصفحةُ تتعثّر والخادمُ
  سليم ثلاثَ مرّاتٍ في دقيقتين، تباطأت إلى مرّةٍ كل نصف دقيقة ولا تدور في حلقة.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef0fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1124" media="(prefers-color-scheme: dark)">
<title>تحديثٌ قيد الإطلاق · أوربت</title>
<style>
@font-face{font-family:"Orbit Sans";font-weight:400;font-display:swap;src:local("IBM Plex Sans Arabic"),url("/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2") format("woff2")}
@font-face{font-family:"Orbit Sans";font-weight:600;font-display:swap;src:local("IBM Plex Sans Arabic SemiBold"),url("/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2") format("woff2")}
@font-face{font-family:"Orbit Display";font-weight:700;font-display:swap;src:local("Readex Pro Bold"),url("/fonts/readex-pro-arabic-700-normal.woff2") format("woff2")}
/* فجرٌ ناعم في الوضع الفاتح، وفضاءُ أوربت العميق في الداكن. */
:root{
  --sky-top:#eef0fb;--sky-mid:#f4f1f8;--sky-low:#fde7da;--sky-horizon:#f9d3bf;--sun:rgba(255,164,112,.42);
  --ink:#10162f;--muted:#475069;--signal:#3f46e0;--blip:#0d8d52;
  --star:rgba(16,22,47,.34);--star2:rgba(63,70,224,.30);
  --planet-hi:#8f9cff;--planet:#3f46e0;--planet-lo:#22277e;--planet-glow:rgba(106,63,224,.30);
  --ring:#3f46e0;--track:rgba(16,22,47,.26);--panel:#3f46e0;--sat:#10B981;--moon:#F59E0B;
  --btn-bg:linear-gradient(135deg,#3f46e0,#6a3fe0);--btn-ink:#ffffff;--btn-line:transparent;--btn-shadow:0 10px 24px -10px #3f46e0;--focus:#3f46e0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --sky-top:#0a1124;--sky-mid:#0e172f;--sky-low:#102c47;--sky-horizon:#12385a;--sun:rgba(56,189,248,.20);
    --ink:#f2fbf8;--muted:#bcd6e8;--signal:#86edc9;--blip:#6be8be;
    --star:rgba(255,255,255,.85);--star2:rgba(205,238,230,.6);
    --planet-hi:#9be2ff;--planet:#38BDF8;--planet-lo:#0b3d66;--planet-glow:rgba(56,189,248,.38);
    --ring:#F8FAFC;--track:rgba(157,236,228,.30);--panel:#38BDF8;--sat:#10B981;--moon:#F59E0B;
    --btn-bg:#ffffff;--btn-ink:#0e2436;--btn-line:transparent;--btn-shadow:0 10px 30px -10px rgba(134,237,201,.6);--focus:#86edc9;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;overflow-x:hidden;position:relative;
  background:
    radial-gradient(ellipse 70% 42% at 50% 100%,var(--sun),transparent 72%),
    linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 42%,var(--sky-low) 82%,var(--sky-horizon) 100%);
  background-color:var(--sky-top);
  color:var(--ink);
  font-family:"Orbit Sans","IBM Plex Sans Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;
}

/* حقلُ النجوم: طبقتان تنجرفان ببطءٍ بسرعتين مختلفتين. */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;inset:-50% -50% -50% -50%;background-repeat:repeat}
.stars .far{
  background-size:280px 280px;opacity:.7;animation:drift 160s linear infinite;
  background-image:
    radial-gradient(1px 1px at 12% 18%,var(--star),transparent),radial-gradient(1px 1px at 41% 64%,var(--star2),transparent),
    radial-gradient(1px 1px at 68% 12%,var(--star),transparent),radial-gradient(1px 1px at 86% 48%,var(--star2),transparent),
    radial-gradient(1px 1px at 27% 88%,var(--star),transparent),radial-gradient(1px 1px at 57% 34%,var(--star2),transparent),
    radial-gradient(1px 1px at 93% 82%,var(--star),transparent);
}
.stars .near{
  background-size:430px 430px;opacity:.85;animation:drift 95s linear infinite;
  background-image:
    radial-gradient(1.6px 1.6px at 22% 30%,var(--star),transparent),radial-gradient(1.3px 1.3px at 74% 22%,var(--star),transparent),
    radial-gradient(1.5px 1.5px at 48% 76%,var(--star2),transparent),radial-gradient(1.2px 1.2px at 8% 62%,var(--star),transparent);
}

/* الكوكب والمدار: أسفل الشاشة، زخرفةٌ خلف النص. */
.scene{position:fixed;inset-inline:0;bottom:0;margin:0 auto;width:min(100%,72vh,820px);z-index:1;pointer-events:none}
.scene svg{display:block;width:100%;height:auto;overflow:visible}
.planet-glow{filter:drop-shadow(0 0 38px var(--planet-glow))}
.track{fill:none;stroke:var(--track);stroke-width:1.2;stroke-dasharray:5 7}
.ring{fill:none;stroke:var(--ring);stroke-width:3.2;stroke-linecap:round}
.ring.back{opacity:.35}
.sat-body{fill:var(--sat)}
.sat-panel{fill:var(--panel);opacity:.9}
.sat-beam{fill:var(--sat);opacity:.25}
.moon{fill:var(--moon)}

/* لوحة المراقبة: أعلى زاوية البداية. */
.hud{
  position:relative;z-index:2;
  max-width:440px;
  padding:max(30px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));
  text-align:start;
}
@media (min-width:760px){.hud{padding-top:max(52px,env(safe-area-inset-top));padding-inline:56px;max-width:520px}}
.telemetry{
  margin:0 0 18px;display:flex;align-items:center;gap:8px;
  font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:11.5px;letter-spacing:.08em;color:var(--signal);
}
.telemetry span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.blip{flex:none;width:7px;height:7px;border-radius:50%;background:var(--blip);box-shadow:0 0 0 3px color-mix(in srgb,var(--blip) 22%,transparent);animation:blink 1.6s steps(1,end) infinite}
h1{margin:0;font-family:"Orbit Display","Orbit Sans",sans-serif;font-size:clamp(26px,7.4vw,36px);font-weight:700;line-height:1.3;letter-spacing:-.01em}
.lead{margin:10px 0 0;font-size:16px;line-height:1.75;color:var(--muted);max-width:30ch}
.retry{
  margin-top:22px;min-height:46px;padding:0 22px;border-radius:999px;cursor:pointer;
  border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--btn-ink);
  font:inherit;font-size:15px;font-weight:600;box-shadow:var(--btn-shadow);
  transition:transform .15s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent;
}
.retry:hover{transform:translateY(-1px)}
.retry:active{transform:scale(.98);box-shadow:none}
.retry:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.note{min-height:22px;margin:14px 0 0;font-size:13px;line-height:1.65;color:var(--muted);max-width:34ch}

/* iPhone Duo, opened as a book (669x867, 951x585): the words take the right page and the planet the left one, around a quiet
   fold, so no line or button sits on the hinge. */
@media screen and (min-width:640px) and (max-width:720px) and (min-height:640px),screen and (min-width:820px) and (max-width:1000px) and (min-height:500px) and (min-aspect-ratio:7/5){
  .hud{max-width:calc(50vw - 16px);min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-block:max(32px,env(safe-area-inset-top)) 40px;padding-inline:max(28px,env(safe-area-inset-right)) 28px}
  .scene{inset-inline:auto 0;margin:0;width:min(calc(50vw - 16px),78vh);bottom:auto;top:50%;transform:translateY(-50%)}
  body::after{content:"";position:fixed;top:0;bottom:0;left:calc(50% - 16px);width:32px;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(16,22,47,.07) 50%,transparent)}
}
@media screen and (prefers-color-scheme:dark) and (min-width:640px) and (max-width:720px) and (min-height:640px),screen and (prefers-color-scheme:dark) and (min-width:820px) and (max-width:1000px) and (min-height:500px) and (min-aspect-ratio:7/5){body::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.32) 50%,transparent)}}
/* Wide and short (laptop posture 951x350, 600x350, folded landscape): words on the right half, the planet on the left half. */
@media screen and (max-height:420px) and (min-width:560px){
  .hud{max-width:56%;padding-top:max(18px,env(safe-area-inset-top));padding-inline:max(24px,env(safe-area-inset-right)) 24px}
  .telemetry{margin-bottom:10px}
  .retry{margin-top:14px}
  .scene{inset-inline:auto 0;margin:0;width:min(42%,92vh)}
}
@keyframes drift{to{transform:translate3d(-280px,140px,0)}}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){
  .stars i,.blip{animation:none}
}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"><i class="far"></i><i class="near"></i></div>

<header class="hud">
  <p class="telemetry" aria-hidden="true"><i class="blip"></i><span id="telemetry" dir="ltr">UPLINK ▸ UPDATING · T+00:00</span></p>
  <h1 id="title">أوربت يتلقّى تحديثاً</h1>
  <p class="lead" id="lead">يعود الاتصال وحده فور اكتمال الإطلاق.</p>
  <button type="button" class="retry" id="retry">أعد الاتصال الآن</button>
  <p class="note" id="note" role="status" aria-live="polite">نرصد الإشارة كل بضع ثوانٍ، وتُفتح صفحتك وحدها حين تصل.</p>
</header>

<!-- كوكبُ علامة أوربت (ألوان public/icon.svg: #090D16 · #38BDF8 · #F8FAFC · #10B981 · #F59E0B). -->
<div class="scene" aria-hidden="true">
  <svg id="scene" viewBox="0 0 400 360" focusable="false">
    <defs>
      <radialGradient id="planet-fill" cx="38%" cy="30%" r="78%">
        <stop offset="0" stop-color="var(--planet-hi)"/>
        <stop offset=".42" stop-color="var(--planet)"/>
        <stop offset="1" stop-color="var(--planet-lo)"/>
      </radialGradient>
      <radialGradient id="planet-shade" cx="70%" cy="78%" r="70%">
        <stop offset=".55" stop-color="#090D16" stop-opacity="0"/>
        <stop offset="1" stop-color="#090D16" stop-opacity=".45"/>
      </radialGradient>
      <clipPath id="front" clipPathUnits="userSpaceOnUse"><rect x="-240" y="0" width="480" height="140"/></clipPath>
      <path id="lane" d="M -182 0 A 182 58 0 1 0 182 0 A 182 58 0 1 0 -182 0"/>
      <g id="craft">
        <rect class="sat-beam" x="-2" y="-2" width="4" height="4" rx="2"/>
        <rect class="sat-panel" x="-15" y="-3" width="9" height="6" rx="1"/>
        <rect class="sat-panel" x="6" y="-3" width="9" height="6" rx="1"/>
        <rect class="sat-body" x="-5" y="-5" width="10" height="10" rx="2.5"/>
      </g>
    </defs>
    <g transform="translate(200 262) rotate(-11)">
      <!-- خلف الكوكب: نصفُ المدار البعيد، والحلقة البعيدة، والقمر حين يمرّ خلفه. -->
      <use href="#lane" class="track"/>
      <ellipse class="ring back" cx="0" cy="0" rx="132" ry="32"/>
      <circle class="moon" cx="-168" cy="-30" r="5.5"/>
      <g><use href="#craft"/><animateMotion dur="14s" repeatCount="indefinite"><mpath href="#lane"/></animateMotion></g>
    </g>
    <g class="planet-glow">
      <circle cx="200" cy="262" r="92" fill="url(#planet-fill)"/>
      <circle cx="200" cy="262" r="92" fill="url(#planet-shade)"/>
    </g>
    <g transform="translate(200 262) rotate(-11)">
      <!-- أمام الكوكب: النصفُ القريب يُرسم فوقه. -->
      <g clip-path="url(#front)">
        <ellipse class="ring" cx="0" cy="0" rx="132" ry="32"/>
        <g><use href="#craft"/><animateMotion dur="14s" repeatCount="indefinite"><mpath href="#lane"/></animateMotion></g>
      </g>
    </g>
  </svg>
</div>
<script>
(function () {
  var HEALTH = "/api/version";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "orbit-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");
  var telemetry = document.getElementById("telemetry");
  var started = Date.now(), signal = "UPDATING";

  /* سطرُ القياس: حالةُ الرابط، وعدد النبضات، والزمن منذ فُتحت الصفحة. */
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function tick() {
    var s = Math.max(0, Math.floor((Date.now() - started) / 1000));
    telemetry.textContent = "UPLINK ▸ " + signal + " · PING " + two(tries) + " · T+" + two(Math.floor(s / 60)) + ":" + two(s % 60);
  }

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  function describe() {
    if (navigator.onLine === false) {
      signal = "NO LINK";
      title.textContent = "انقطعت الإشارة من جهتك";
      lead.textContent = "جهازك غير متصل بالشبكة. نعيد الاتصال حين تعود.";
      note.textContent = "";
    } else if (stuck()) {
      signal = "UPDATING · SLOW";
      title.textContent = "أوربت يتلقّى تحديثاً";
      lead.textContent = "الإطلاق أطول من المعتاد هذه المرة.";
      note.textContent = "نرصد الإشارة كل نصف دقيقة، ولك أن تعيد الاتصال الآن.";
    } else {
      signal = "UPDATING";
      title.textContent = "أوربت يتلقّى تحديثاً";
      lead.textContent = "يعود الاتصال وحده فور اكتمال الإطلاق.";
      note.textContent = "نرصد الإشارة كل بضع ثوانٍ، وتُفتح صفحتك وحدها حين تصل.";
    }
    tick();
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  /* حركةٌ أقلّ: القمرُ الصناعيّ يقف في مقدّمة مداره. */
  try {
    var scene = document.getElementById("scene");
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches && scene && scene.pauseAnimations) {
      scene.setCurrentTime(5);
      scene.pauseAnimations();
    }
  } catch (e) {}
  if (typeof window.setInterval === "function") window.setInterval(tick, 1000);

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
